name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The suite deliberately needs no model weights and no network, so the
      # heavy optional extras are not installed here.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q --cov=assaypilot --cov-report=term-missing

      - name: Run the bundled example end to end
        run: |
          assaypilot validate \
            --campaign examples/simulated-enzyme/campaign.json \
            --measurements examples/simulated-enzyme/measurements.csv \
            --candidates examples/simulated-enzyme/candidates.csv
          assaypilot plan \
            --campaign examples/simulated-enzyme/campaign.json \
            --measurements examples/simulated-enzyme/measurements.csv \
            --candidates examples/simulated-enzyme/candidates.csv \
            --representation physchem --bootstrap 100 -o ci_plan
          test -s ci_plan/selected_variants.csv
          test -s ci_plan/report.html
          test -s ci_plan/run_manifest.json

  esm:
    name: ESM-2 tests (slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Cache the checkpoint so repeat runs do not re-download it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-esm2-8M-v1

      - name: Install with the esm and app extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[esm,app,dev]"

      # The smallest ESM-2 release: enough to check tokenizer offsets, pooling,
      # additivity, and revision recording without a large download.
      - name: Test against a real checkpoint
        env:
          ASSAYPILOT_TEST_CHECKPOINT: facebook/esm2_t6_8M_UR50D
        run: pytest -m slow -q

      # The interface tests need Streamlit, so they only run in this job; the
      # core suite skips them.
      - name: Test the interface
        run: pytest tests/test_app.py -q

      # The fast suite must stay offline even when torch is installed.
      - name: Confirm the fast suite needs no model weights
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HOME: ${{ runner.temp }}/empty-hf
        run: pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  build:
    name: build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
