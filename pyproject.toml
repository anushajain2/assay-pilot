[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "assaypilot"
version = "0.1.0"
description = "Plan the next round of protein variant experiments from the measurements you already have."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
  "protein engineering",
  "directed evolution",
  "active learning",
  "protein language models",
  "assay",
  "experiment design",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "jinja2>=3.1",
]

[project.optional-dependencies]
esm = ["torch>=2.1", "transformers>=4.40"]
app = ["streamlit>=1.33", "altair>=5.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

[project.scripts]
assaypilot = "assaypilot.cli:main"

[project.urls]
Homepage = "https://github.com/assaypilot/assaypilot"
Documentation = "https://github.com/assaypilot/assaypilot/tree/main/docs"
Issues = "https://github.com/assaypilot/assaypilot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/assaypilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:assaypilot.*"]
# Tests needing a downloaded protein-language-model checkpoint are opt-in, so
# the default suite stays fast and works offline. Run them with `pytest -m slow`.
addopts = "-m 'not slow'"
markers = [
  "slow: needs torch, transformers, and a downloadable ESM-2 checkpoint",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The HTML report is one embedded template; its CSS lines are not Python code.
"src/assaypilot/reporting/html.py" = ["E501"]
